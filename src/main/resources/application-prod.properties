spring.application.name=swb-backend

# Azure Database for PostgreSQL Configuration
spring.datasource.url=${AZURE_POSTGRES_JDBC_URL}
spring.datasource.username=${AZURE_POSTGRES_USERNAME}
spring.datasource.password=${AZURE_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Port configuration (Azure App Service expects PORT / 8080 by default)
server.port=${PORT:8080}

# Actuator / Health Probes for Azure Liveness/Readiness checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
