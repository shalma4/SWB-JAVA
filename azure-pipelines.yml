trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

stages:
  - stage: BuildAndTest
    displayName: 'Build, Test, and Package JAR'
    jobs:
      - job: MavenBuild
        displayName: 'Maven Package & Publish Artifact'
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Set Java 21'
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Cache@2
            displayName: 'Cache Maven local repository'
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(MAVEN_CACHE_FOLDER)

          # Step 1: Execute all JUnit 5 & MockMvc integration tests
          - script: |
              chmod +x mvnw
              ./mvnw clean test $(MAVEN_OPTS) --batch-mode
            displayName: 'Run Automated Tests (./mvnw test)'

          # Step 2: Publish test results to the "Tests" tab in Azure DevOps
          - task: PublishTestResults@2
            displayName: 'Publish Surefire Test Reports'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              mergeTestResults: true
              failTaskOnFailedTests: true
              testRunTitle: 'ScotWest Core Banking Test Run'

          # Step 3: Build the production executable JAR
          - script: |
              ./mvnw package -DskipTests $(MAVEN_OPTS) --batch-mode
            displayName: 'Package Production JAR (./mvnw package)'

          # Step 4: Copy the built JAR to the artifact staging directory
          - task: CopyFiles@2
            displayName: 'Stage JAR Artifact'
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)/target'
              Contents: '*.jar'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'

          # Step 5: Publish the JAR to Azure DevOps Pipeline Artifacts
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Pipeline Artifact (drop)'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'
